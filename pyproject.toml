[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rpg_gpx"
version = "2.0"
description = "Paket-Fassade fuer rpg_gpx."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "RalfPeter", email = "ralfpeter.bergheim@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "lxml"
]

[tool.setuptools.packages.find]
where = ["."]
